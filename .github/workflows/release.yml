name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installers:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/aletheia-app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content rust/aletheia-app/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
      - name: Install dependencies
        working-directory: rust/aletheia-app
        run: npm ci
      - name: Validate release source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python tools/release_check.py
          python -m pytest --tb=short -q
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --manifest-path rust/Cargo.toml --workspace --all-targets --locked
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
          npm --prefix rust/aletheia-app run lint
      - name: Remove stale bundle artifacts
        shell: pwsh
        run: Remove-Item rust/target/release/bundle -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build installers
        working-directory: rust/aletheia-app
        run: npm run bundle -- --bundles msi,nsis
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem rust/target/release/bundle -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetRelativePath((Get-Location).Path, $_.Path))" } | Set-Content -Encoding utf8 SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem rust/target/release/bundle -Recurse -File).FullName SHA256SUMS.txt --generate-notes --verify-tag
