name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and tests
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Publication policy
        shell: pwsh
        run: python tools/release_check.py

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest --tb=short -q

  rust:
    name: Rust workspace
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: rust

      - name: Resolve pinned toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test every target
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/aletheia-app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rust/aletheia-app/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
