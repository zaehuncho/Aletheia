[workspace]
resolver = "3"
members = ["aletheia-core", "aletheia-app/src-tauri"]

# rust/aletheia-app (Tauri + React) joins this workspace in turn 2 once
# `npm create tauri-app` scaffolds it. Until then aletheia-core builds solo.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Isaiah <idiahjackson@gmail.com>"]
repository = "https://github.com/zaehuncho/Aletheia"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
