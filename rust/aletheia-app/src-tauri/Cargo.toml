[package]
name = "aletheia-app"
version = "0.2.0"
description = "Aletheia analyst workbench - Tauri front-end for the aletheia-core engine."
authors = ["zaehuncho"]
license = "MIT"
repository = "https://github.com/zaehuncho/Aletheia"
edition = "2021"
rust-version = "1.88"

[lib]
name = "aletheia_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aletheia-core = { path = "../../aletheia-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
