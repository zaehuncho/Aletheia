[package]
name = "aletheia_canary"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["zaehuncho"]
description = "Benign write-then-execute canary for validating Aletheia's dynamic detectors. Not malware."
publish = false

[dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
